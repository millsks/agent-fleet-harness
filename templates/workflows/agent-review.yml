# Reviewer agent: comments on every pull request.
name: agent-review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Use the reviewer subagent to review PR #${{ github.event.pull_request.number }}
            against its spec in specs/ if one exists. Post the findings as one PR review.
          claude_args: "--max-turns 25"
