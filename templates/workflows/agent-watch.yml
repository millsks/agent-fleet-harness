# Watcher agent: nightly, files de-duplicated issues for CI failures and flaky tests.
name: agent-watch
on:
  schedule:
    - cron: "43 9 * * *"
  workflow_dispatch:
concurrency:
  group: agent-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: Use the watcher subagent for the last 24 hours on the default branch.
          claude_args: "--max-turns 20"
